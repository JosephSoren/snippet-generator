<body class="bg-gray-100 min-h-screen flex flex-col">
  <header class="bg-blue-600 text-white p-4">
    <h1 class="text-2xl font-bold">VS Code Snippet Generator</h1>
  </header>
  <main class="flex-grow container mx-auto p-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Input Form -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-semibold mb-4">Create Snippet</h2>
        <div class="space-y-4">
          <div>
            <label for="snippetName" class="block text-sm font-medium text-gray-700">Snippet Name</label>
            <input type="text" id="snippetName" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="e.g., Console Log">
          </div>
          <div>
            <label for="snippetPrefix" class="block text-sm font-medium text-gray-700">Prefix</label>
            <input type="text" id="snippetPrefix" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="e.g., clog">
          </div>
          <div>
            <label for="snippetDescription" class="block text-sm font-medium text-gray-700">Description</label>
            <input type="text" id="snippetDescription" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="e.g., Inserts a console.log statement">
          </div>
          <div>
            <label for="snippetBody" class="block text-sm font-medium text-gray-700">Body (one line per enter)</label>
            <textarea id="snippetBody" rows="6" class="mt-1 block w-full p-2 border border-gray-300 rounded-md" placeholder="e.g., console.log($1);"></textarea>
          </div>
          <div class="flex space-x-2">
            <button id="addSnippet" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600">Add Snippet</button>
            <button id="clearForm" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600">Clear Form</button>
          </div>
        </div>
        <p id="status" class="mt-4 text-sm text-green-600 hidden"></p>
      </div>
      <!-- Preview and Controls -->
      <div class="bg-white p-6 rounded-lg shadow-md">
        <h2 class="text-xl font-semibold mb-4">Generated Snippets</h2>
        <div id="snippetList" class="mb-4">
          <p class="text-gray-500">No snippets added yet.</p>
        </div>
        <h3 class="text-lg font-medium mb-2">JSON Preview</h3>
        <pre id="jsonPreview" class="p-4 rounded-md h-64 overflow-y-auto">{} </pre>
        <div class="flex space-x-2 mt-4">
          <button id="copySnippet" class="bg-teal-500 text-white px-4 py-2 rounded-md hover:bg-teal-600">Copy Snippet</button>
          <button id="downloadSnippet" class="bg-green-500 text-white px-4 py-2 rounded-md hover:bg-green-600">Download Snippets</button>
          <button id="clearAll" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600">Clear All</button>
        </div>
      </div>
    </div>
  </main>
  <footer class="bg-gray-800 text-white p-4 text-center">
    <p>© 2025 VS Code Snippet Generator</p>
  </footer>
  <script>
    const snippets = {};

    // Helper to show status messages
    function showStatus(message, isError = false) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.classList.remove('hidden', 'text-green-600', 'text-red-600');
      status.classList.add(isError ? 'text-red-600' : 'text-green-600');
      setTimeout(() => status.classList.add('hidden'), 3000);
    }

    // Update JSON preview
    function updatePreview() {
      const jsonPreview = document.getElementById('jsonPreview');
      jsonPreview.textContent = JSON.stringify(snippets, null, 2);
    }

    // Update snippet list display
    function updateSnippetList() {
      const snippetList = document.getElementById('snippetList');
      snippetList.innerHTML = '';
      if (Object.keys(snippets).length === 0) {
        snippetList.innerHTML = '<p class="text-gray-500">No snippets added yet.</p>';
        return;
      }
      const ul = document.createElement('ul');
      ul.className = 'list-disc pl-5';
      for (const name in snippets) {
        const li = document.createElement('li');
        li.textContent = `${name} (Prefix: ${snippets[name].prefix})`;
        ul.appendChild(li);
      }
      snippetList.appendChild(ul);
    }

    // Add snippet
    document.getElementById('addSnippet').addEventListener('click', () => {
      const name = document.getElementById('snippetName').value.trim();
      const prefix = document.getElementById('snippetPrefix').value.trim();
      const description = document.getElementById('snippetDescription').value.trim();
      const body = document.getElementById('snippetBody').value.split('\n').map(line => line.replace(/\t/g, '\\t'));

      if (!name || !prefix || !body[0]) {
        showStatus('Please fill in Name, Prefix, and Body.', true);
        return;
      }

      snippets[name] = { prefix, body, description };
      updatePreview();
      updateSnippetList();
      showStatus('Snippet added successfully!');

      // Clear form
      document.getElementById('snippetName').value = '';
      document.getElementById('snippetPrefix').value = '';
      document.getElementById('snippetDescription').value = '';
      document.getElementById('snippetBody').value = '';
    });

    // Clear form
    document.getElementById('clearForm').addEventListener('click', () => {
      document.getElementById('snippetName').value = '';
      document.getElementById('snippetPrefix').value = '';
      document.getElementById('snippetDescription').value = '';
      document.getElementById('snippetBody').value = '';
      showStatus('Form cleared.');
    });

    // Clear all snippets
    document.getElementById('clearAll').addEventListener('click', () => {
      for (const key in snippets) delete snippets[key];
      updatePreview();
      updateSnippetList();
      showStatus('All snippets cleared.');
    });

    // Download snippets
    document.getElementById('downloadSnippet').addEventListener('click', () => {
      if (Object.keys(snippets).length === 0) {
        showStatus('No snippets to download.', true);
        return;
      }
      const blob = new Blob([JSON.stringify(snippets, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'my-snippets.code-snippets';
      a.click();
      URL.revokeObjectURL(url);
      showStatus('Snippets downloaded!');
    });

    // Copy snippet to clipboard
    document.getElementById('copySnippet').addEventListener('click', () => {
      if (Object.keys(snippets).length === 0) {
        showStatus('No snippets to copy.', true);
        return;
      }
      const text = JSON.stringify(snippets, null, 2);
      navigator.clipboard.writeText(text).then(() => {
        showStatus('Snippets copied to clipboard!');
      }).catch(err => {
        showStatus('Failed to copy snippets.', true);
        console.error('Clipboard error:', err);
      });
    });
  </script>
</body>
